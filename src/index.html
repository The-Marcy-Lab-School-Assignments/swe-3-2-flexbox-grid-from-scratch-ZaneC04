<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcy Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img class="logo" src="img/logo.png" alt="Logo">
        <h1>Marcy Music</h1>
        <nav>
            <ul>
                <li><a href="#">Library</a></li>
                <li><a href="#">Explore</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Playlists</h2>
            <ul class="play-list">
                <li>
                    <figure>
                        <img src="img/playlist-chill.jpg" alt="Chill Vibes Image">
                        <figcaption>
                            <p>Chill Vibes</p>
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-focus.jpg" alt="Focus Image">
                        <figcaption>
                            <p>Focus</p>
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-late-night.jpg" alt="Late Night Image">
                        <figcaption>
                            <p>Late Night</p>
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-love.jpg" alt="Love Image">
                        <figcaption>
                            <p>Love Songs</p>
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-oldies.jpg" alt="Oldies Image">
                        <figcaption>
                            <p>Oldies</p>
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-sad.jpg" alt="Sad Image">
                        <figcaption>
                            <p>Sad</p>
                        </figcaption>
                    </figure>
                </li>
            </ul>
            <h2>Albums</h2>
            <ul class="album-list">
                <li>
                    <figure>
                        <img src="img/album-midnight-dreams.jpg" alt="Midnight Dreams Image">
                        <figcaption>
                            <p>Midnight Dreams</p>
                        </figcaption>
                        <p class="artist">Luna Ray</p>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/album-electric-soul.jpg" alt="Electric Soul Image">
                        <figcaption>
                            <p>Electric Soul</p>
                        </figcaption>
                        <p class="artist">The Voltage</p>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/album-golden-hour.jpg" alt="Golden Hour">
                        <figcaption>
                            <p>Golden Hour</p>
                        </figcaption>
                        <p class="artist">Sunset Collective</p>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/album-kermit-does-jazz.jpg" alt="Kermit Image">
                        <figcaption>
                            <p>Kermit Does Jazz</p>
                        </figcaption>
                        <p class="artist">Kermit the Frog</p>
                    </figure>
                </li>
            </ul>
            <footer>
                <p>Made with ♥️ at <a href="https://www.marcylabschool.org/">Marcy Lab School</a></p>
            </footer>
        </section>
    </main>
</body>

</html>
